name: CI (push)

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Bazel target pattern(s) to run instead of the job default'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    # Disabled: lint/format/static-analysis gate only, executes no package code.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Check code lint
        run: pnpm tslint
      - name: Check for circular dependencies
        run: pnpm ts-circular-deps:check
      - name: Validate pull approve configuration
        run: pnpm ng-dev pullapprove verify
      - name: Validate angular robot configuration
        run: pnpm ng-dev ngbot verify
      - name: Validate agent skills
        run: pnpm ng-dev ai skills validate
      - name: Confirm code builds with typescript as expected
        run: pnpm check-tooling-setup

  devtools:
    # Disabled: Cypress e2e + RBE; unrelated to @angular/compiler and cannot run without RBE.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
        with:
          disable-package-manager-cache: true
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@ba726e7bca0b08b125ccc6f93c233749e1213c17
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm devtools:test
      - name: Test build
        run: pnpm devtools:build:chrome
      - name: Cypress run
        uses: cypress-io/github-action@c495c3ddffba403ba11be95fffb67e25203b3799 # v7.1.10
        with:
          command: pnpm devtools:test:e2e
          start: pnpm bazel run //devtools/src:devserver
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 300
          install: false

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiler
            targets: //packages/compiler/test/...
          - name: core
            targets: //packages/core/test:test //packages/core/test:test_web
          - name: core-acceptance
            targets: //packages/core/test/acceptance/...
          - name: compiler-cli
            targets: //packages/compiler-cli/test/ngtsc/... //packages/compiler-cli/test/compliance/...
    name: test (${{ matrix.name }})
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      # Upstream runs `pnpm test:ci` (all of `//...`) on RBE. The fork has no RBE
      # credential, so the suite is sharded over the packages whose sources we ship
      # or depend on, and each shard runs the project's own Bazel test targets.
      - name: Run CI tests for framework
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            pnpm bazel test -- ${{ inputs.test-filter }}
          else
            pnpm bazel test -- ${{ matrix.targets }}
          fi

  integration-tests:
    # Disabled: `//integration/...` needs a full framework release build; does not fit the CI budget without RBE.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel Remote Caching
        uses: angular/dev-infra/github-actions/bazel/configure-remote@ba726e7bca0b08b125ccc6f93c233749e1213c17
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run integration CI tests for framework
        run: pnpm integration-tests:ci

  adev:
    # Disabled: unrelated to the @angular/compiler package and does not fit the budget without RBE.
    if: false
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@ba726e7bca0b08b125ccc6f93c233749e1213c17
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm bazel test //adev/...
      - name: Build adev in fast mode to ensure it continues to work
        run: pnpm bazel build //adev:build

  vscode-ng-language-service:
    # Disabled: unrelated to the @angular/compiler package and does not fit the budget without RBE.
    if: false
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@ba726e7bca0b08b125ccc6f93c233749e1213c17
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm bazel test //vscode-ng-language-service/...

  build-npm-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      # `--config=release` runs the workspace stamping script so the
      # `0.0.0-PLACEHOLDER` version in packages/compiler/package.json is replaced
      # with the real release version. Only the @angular/compiler package is built;
      # `pnpm build` would build every release package and does not fit the budget.
      - name: Build the @angular/compiler npm package
        run: pnpm bazel build --config=release //packages/compiler:npm_package
      # The published tarball was packed with npm 10.9.7; npm's always-include rules
      # differ across majors, so pack with that exact version.
      - name: Pack the npm package
        run: |
          npm i -g npm@10.9.7
          mkdir -p dist/release-artifacts
          npm pack ./dist/bin/packages/compiler/npm_package --pack-destination dist/release-artifacts
          mv dist/release-artifacts/angular-compiler-*.tgz dist/release-artifacts/compiler-21.2.19.tgz
          ls -l dist/release-artifacts
      - name: Upload the npm package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: dist/release-artifacts/compiler-21.2.19.tgz
          if-no-files-found: error

  zone-js:
    # Disabled: builds and tests the separate zone.js package, incl. Electron.
    if: false
    runs-on:
      labels: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@ba726e7bca0b08b125ccc6f93c233749e1213c17
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - run: |
          pnpm bazel build \
          //packages/zone.js/bundles:zone.umd.js \
          //packages/zone.js:npm_package \
          //packages/zone.js/test/closure:closure

      - run: |
          rm -Rf packages/zone.js/build
          rm -Rf packages/zone.js/test/extra/*.umd.js

          mkdir -p packages/zone.js/build/
          mkdir -p packages/zone.js/build/test/

          cp dist/bin/packages/zone.js/bundles/zone.umd.js packages/zone.js/build/zone.umd.js
          cp dist/bin/packages/zone.js/npm_package/bundles/zone-mix.umd.js ./packages/zone.js/test/extra/
          cp dist/bin/packages/zone.js/npm_package/bundles/zone-patch-electron.umd.js ./packages/zone.js/test/extra/
          cp dist/bin/packages/zone.js/test/closure/zone.closure.js ./packages/zone.js/build/test/zone.closure.mjs

        # Install
      - run: pnpm -C packages/zone.js install --frozen-lockfile
        # Run zone.js tools tests
      - run: pnpm -C packages/zone.js promisefinallytest
      - run: pnpm -C packages/zone.js jest:test
      - run: pnpm -C packages/zone.js jest:nodetest
      - run: pnpm -C packages/zone.js vitest:test
      - run: pnpm -C packages/zone.js electrontest
      - run: pnpm -C packages/zone.js/test/typings test

  # saucelabs:
  #   runs-on: ubuntu-latest
  #   env:
  #     SAUCE_TUNNEL_IDENTIFIER: angular-framework-${{ github.run_number }}
  #   steps:
  #     - name: Initialize environment
  #       uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@b5a3609f89c06eb4037dce22a93641213a5d1508
  #     - name: Install node modules
  #       run: pnpm install --frozen-lockfile
  #     - uses: ./.github/actions/saucelabs-legacy

  adev-deploy:
    # Disabled: deploys to Firebase and needs secrets the fork does not have.
    if: false
    needs: [adev]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@ba726e7bca0b08b125ccc6f93c233749e1213c17
      - name: Install node modules
        run: pnpm install --frozen-lockfile
      - name: Build adev
        # `snapshot-build` config is used to stamp the exact version with sha in the footer.
        run: pnpm bazel build //adev:build.production --config=snapshot-build
      - name: Deploy to firebase
        uses: ./.github/actions/deploy-docs-site
        with:
          serviceKey: ${{ secrets.ANGULAR_DEV_SITE_DEPLOY }}
          githubReleaseTrainReadToken: ${{ secrets.DOCS_DEPLOY_GITHUB_RELEASE_TRAIN_TOKEN }}
          configPath: 'adev/firebase.json'
          distDir: 'dist/bin/adev/dist'
      - name: Update Algolia synonym record
        run: node adev/scripts/synonyms/update-synonyms.mts
        env:
          ALGOLIA_KEY: ${{ secrets.ALGOLIA_SYNONYM_MANAGER }}
